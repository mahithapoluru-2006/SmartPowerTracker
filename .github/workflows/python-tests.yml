
name: SmartPowerTracker Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare dataset
        run: |
          mkdir -p data/raw data/processed reports/figures
          curl -L "https://archive.ics.uci.edu/static/public/235/individual+household+electric+power+consumption.zip" -o data/raw/household_power_consumption.zip
          python -c "import zipfile; zipfile.ZipFile('data/raw/household_power_consumption.zip').extractall('data/raw')"

      - name: Run data loading
        run: python src/load_data.py

      - name: Run data cleaning
        run: python src/clean_data.py

      - name: Run data analysis
        run: python src/analysis.py

      - name: Run anomaly detection
        run: python src/anomaly_detection.py

      - name: Run automated tests
        run: pytest -v
